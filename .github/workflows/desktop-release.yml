# Mac 应用的预发版和正式版。版本号只看 desktop/package.json 的 version。
#
# - PR 打开/推送：打包，发预发版 v<version>-pr.<N>（每次推送替换），在 PR 里贴链接
# - PR 关闭：删掉这个 PR 的预发版和 tag
# - 推到 main：v<version> 还没有就打包发正式版；已经有了就跳过（没改版本号的合并不发版）
name: desktop-release

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'web/**'
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
      - '.github/release-notes.md'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
      - '.github/release-notes.md'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  cleanup:
    name: 删除 PR 预发版
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 删除 v*-pr.<N>
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | { grep -E -- "-pr\.${PR}\$" || true; } \
            | while read -r tag; do
                echo "deleting $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done

  build:
    name: 打包并发布
    if: github.event_name == 'push' || github.event.action != 'closed'
    # Linux 上打包（macOS 机器经常排队排不到），用 rcodesign 做 ad-hoc 签名
    runs-on: ubuntu-latest
    env:
      # PR 上用 PR 自己的提交，不用 GitHub 生成的合并提交
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # 别用 RCODESIGN_ 开头的变量名：rcodesign 会把它们当成自己的配置读
      RCS_PKG: apple-codesign-0.29.0-x86_64-unknown-linux-musl
      RCS_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: 读版本号
        id: meta
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version 已经发布过，跳过（要发新版就改 desktop/package.json 的 version）"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: 网页依赖和测试
        if: steps.meta.outputs.skip != 'true'
        working-directory: web
        run: |
          npm ci
          npm test

      - name: 安装 rcodesign
        if: steps.meta.outputs.skip != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/$RCS_PKG.tar.gz"
          echo "$RCS_SHA256  $RUNNER_TEMP/rcodesign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$RCS_PKG" >> "$GITHUB_PATH"

      - name: 打包 arm64 和 x64
        if: steps.meta.outputs.skip != 'true'
        working-directory: desktop
        env:
          # 打包只用 electron 的版本号，Mac 版的 Electron 由 packager 另外下载
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          # rcodesign verify 不支持整个 bundle、对 ad-hoc 签名会误报，这里只确认每个 bundle 都签上了
          [ "$(grep -c 'ad-hoc signed with rcodesign' "$RUNNER_TEMP/build.log")" = 2 ]
          for arch in arm64 x64; do
            app="build/out/Happy-darwin-$arch/Happy.app"
            test -f "$app/Contents/_CodeSignature/CodeResources"
            for helper in "$app"/Contents/Frameworks/*.app; do
              test -f "$helper/Contents/_CodeSignature/CodeResources"
            done
            for fw in "$app"/Contents/Frameworks/*.framework; do
              test -f "$fw/Versions/A/_CodeSignature/CodeResources"
            done
          done

      - name: 发布预发版
        if: github.event_name == 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="v$VERSION-pr.$PR"
          # 换掉这个 PR 之前的预发版（版本号中途改过的也一起删）
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | { grep -E -- "-pr\.${PR}\$" || true; } \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
          {
            echo "> PR #$PR 的预发构建（提交 ${SHA:0:7}），PR 关闭后自动删除。"
            echo
            sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" desktop/dist/*.zip \
            --target "$SHA" --prerelease --latest=false \
            --title "Happy for macOS $VERSION（PR #$PR 预发）" \
            --notes-file "$RUNNER_TEMP/notes.md"
          url=$(gh release view "$tag" --json url --jq .url)
          gh pr comment "$PR" --edit-last --create-if-none --body "$(printf '%s\n\n%s\n%s' \
            "Mac 预发版 [\`$tag\`]($url) 已更新（提交 ${SHA:0:7}）。" \
            "- Apple 芯片：Happy-$VERSION-mac-arm64.zip" \
            "- Intel：Happy-$VERSION-mac-x64.zip")"

      - name: 发布正式版
        if: github.event_name == 'push' && steps.meta.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sed "s/{{VERSION}}/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" desktop/dist/*.zip \
            --target "$SHA" --latest \
            --title "Happy for macOS $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
